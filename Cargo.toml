[package]
name = "kore-memory"
version = "0.4.0"
edition = "2024"
autobenches = false

[features]
default = []
bench = []

[dependencies]
heapless = { version = "0.9.2", default-features = false, features = [
    "nightly",
] }
memory_addr = { version = "0.4.1", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = { version = "0.15.2", default-features = false, features = [
    "instructions",
] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64-cpu = { version = "11.2.0", default-features = false }
aarch64-cpu-ext = { version = "0.1.4", default-features = false }

[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = { version = "0.16.0", default-features = false }

[[bench]]
name = "walker"
harness = false
required-features = ["bench"]

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
